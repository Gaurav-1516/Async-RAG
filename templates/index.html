<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async RAG - Document Ingestion</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --error: #ef4444;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }
        p.subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 24px;
        }
        .dropzone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 36px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: rgba(255, 255, 255, 0.02);
        }
        .dropzone:hover, .dropzone.dragover {
            border-color: var(--primary);
            background-color: rgba(79, 70, 229, 0.05);
        }
        .dropzone svg {
            width: 48px;
            height: 48px;
            fill: none;
            stroke: var(--text-muted);
            margin-bottom: 12px;
        }
        .dropzone p {
            font-size: 0.95rem;
            color: var(--text-muted);
        }
        .dropzone span {
            color: var(--primary);
            font-weight: 600;
        }
        .file-name {
            margin-top: 12px;
            font-size: 0.85rem;
            color: var(--text-main);
            word-break: break-all;
            display: none;
        }
        input[type="file"] {
            display: none;
        }
        button.btn {
            width: 100%;
            margin-top: 20px;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button.btn:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }
        button.btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .status-box {
            margin-top: 20px;
            padding: 14px;
            border-radius: 8px;
            font-size: 0.875rem;
            display: none;
            word-break: break-all;
        }
        .status-box.info {
            background-color: rgba(79, 70, 229, 0.15);
            border: 1px solid var(--primary);
            color: #c7d2fe;
            display: block;
        }
        .status-box.success {
            background-color: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--success);
            color: #a7f3d0;
            display: block;
        }
        .status-box.error {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--error);
            color: #fecaca;
            display: block;
        }
        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 2px solid #ffffff;
            width: 16px;
            height: 16px;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Document Ingestion</h1>
        <p class="subtitle">Upload PDF or Text files to update the RAG vector store</p>
        
        <div class="dropzone" id="dropzone">
            <svg viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" />
            </svg>
            <p>Drag and drop your file here, or <span>browse</span></p>
            <div class="file-name" id="fileName"></div>
        </div>
        <input type="file" id="fileInput" accept=".pdf,.txt">

        <button class="btn" id="uploadBtn" disabled>Upload to Vector Store</button>

        <div class="status-box" id="statusBox"></div>
    </div>

    <script>
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileNameDisplay = document.getElementById('fileName');
        const statusBox = document.getElementById('statusBox');

        let selectedFile = null;

        dropzone.addEventListener('click', () => fileInput.click());

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });

        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            selectedFile = file;
            fileNameDisplay.textContent = `Selected: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
            fileNameDisplay.style.display = 'block';
            uploadBtn.disabled = false;
            statusBox.className = 'status-box';
            statusBox.style.display = 'none';
        }

        uploadBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            uploadBtn.disabled = true;
            uploadBtn.innerHTML = '<span class="spinner"></span> Ingesting into Vector Store...';
            showStatus('Uploading and processing document...', 'info');

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Upload failed');
                }

                showStatus(data.message || 'Successfully uploaded and indexed into Vector Store!', 'success');
            } catch (err) {
                showStatus(`Error: ${err.message}`, 'error');
            } finally {
                resetBtn();
            }
        });

        function showStatus(msg, type) {
            statusBox.textContent = msg;
            statusBox.className = `status-box ${type}`;
        }

        function resetBtn() {
            uploadBtn.disabled = false;
            uploadBtn.innerHTML = 'Upload to Vector Store';
        }
    </script>
</body>
</html>
